<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATDIC · Entrar</title>
    <style>
        :root { --fondo: #f3f4f6; --tarjeta: #ffffff; --texto: #111827; --suave: #6b7280; --borde: #d1d5db;
                --acento: #1e3a8a; --acento-texto: #ffffff; --error: #b91c1c; }
        @media (prefers-color-scheme: dark) {
            :root { --fondo: #0f172a; --tarjeta: #1e293b; --texto: #f1f5f9; --suave: #94a3b8; --borde: #334155;
                    --acento: #3b82f6; --acento-texto: #0b1220; --error: #f87171; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
               background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
        main { width: 100%; max-width: 360px; background: var(--tarjeta); border: 1px solid var(--borde);
               border-radius: 10px; padding: 28px 24px; }
        h1 { margin: 0 0 4px; font-size: 1.25rem; }
        p.sub { margin: 0 0 20px; color: var(--suave); font-size: .9rem; }
        label { display: block; font-size: .875rem; font-weight: 600; margin: 14px 0 6px; }
        input { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: transparent;
                border: 1px solid var(--borde); border-radius: 6px; }
        input:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
        button { margin-top: 22px; width: 100%; padding: 11px; font: inherit; font-weight: 600; border: 0;
                 border-radius: 6px; background: var(--acento); color: var(--acento-texto); cursor: pointer; }
        button:disabled { opacity: .6; cursor: default; }
        #mensaje { min-height: 1.5em; margin: 14px 0 0; color: var(--error); font-size: .9rem; }
    </style>
</head>
<body>
<main>
    <h1>CATDIC · Control Taller</h1>
    <p class="sub">Entra con tu usuario.</p>
    <form id="entrar" autocomplete="on">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="username" autocomplete="username" required autofocus>
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="password" type="password" autocomplete="current-password" required>
        <button id="boton" type="submit">Entrar</button>
        <p id="mensaje" role="alert"></p>
    </form>
</main>
<script>
    // Fundación F2: la sesión queda en una cookie HttpOnly que esta página no puede leer. El servidor exige el
    // encabezado propio y que la petición venga de esta misma dirección.
    const formulario = document.getElementById('entrar');
    const mensaje = document.getElementById('mensaje');
    const boton = document.getElementById('boton');

    function destino() {
        const volver = new URLSearchParams(location.search).get('volver') || '/';
        return volver.startsWith('/') && !volver.startsWith('//') ? volver : '/';   // solo dentro de este servidor
    }

    formulario.addEventListener('submit', async (e) => {
        e.preventDefault();
        mensaje.textContent = '';
        boton.disabled = true;
        try {
            const r = await fetch('/api/sesion', {
                method: 'POST', credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json', 'X-CATDIC-Peticion': '1' },
                body: JSON.stringify({ usuario: formulario.usuario.value, contrasena: formulario.contrasena.value }),
            });
            if (r.ok) { location.href = destino(); return; }
            if (r.status === 429) {
                const minutos = Math.ceil((Number(r.headers.get('Retry-After')) || 60) / 60);
                mensaje.textContent = `Demasiados intentos fallidos. Vuelve a intentarlo en ${minutos} min.`;
            } else if (r.status === 401) {
                mensaje.textContent = 'Usuario o contraseña incorrectos.';
            } else {
                mensaje.textContent = 'No se pudo entrar (error ' + r.status + ').';
            }
        } catch (err) {
            mensaje.textContent = 'No hay conexión con el servidor local.';
        } finally {
            boton.disabled = false;
            formulario.contrasena.value = '';
        }
    });
</script>
</body>
</html>
